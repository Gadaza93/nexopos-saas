<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- NexoPos · ícono para instalar la app web (icon-192.png / icon-512.png). A sangre: Android lo recorta en círculo o
       cuadrado, así que el símbolo queda dentro de la zona segura (círculo central del 80 %). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A34"/>
      <stop offset="1" stop-color="#12141A"/>
    </linearGradient>
    <linearGradient id="pierna-izq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A1F"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3412"/>
      <stop offset="1" stop-color="#E6731B"/>
    </linearGradient>
    <linearGradient id="pierna-der" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB45C"/>
      <stop offset="1" stop-color="#FF8C32"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <g transform="translate(150 150) scale(0.589)">
    <path d="M0 96 L96 32 L96 360 L0 360 Z" fill="url(#pierna-izq)"/>
    <path d="M96 32 L360 232 L360 328 L96 128 Z" fill="url(#diagonal)"/>
    <path d="M264 0 L360 0 L360 328 L264 264 Z" fill="url(#pierna-der)"/>
  </g>
</svg>
