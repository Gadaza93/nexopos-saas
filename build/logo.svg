<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NexoPos · logo principal (fuente de logo.png). Símbolo «N» de cinta plegada heredado de NexoBar, paleta Obsidian. -->
  <defs>
    <linearGradient id="pierna-izq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A1F"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3412"/>
      <stop offset="1" stop-color="#E6731B"/>
    </linearGradient>
    <linearGradient id="pierna-der" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB45C"/>
      <stop offset="1" stop-color="#FF8C32"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#FF8C32" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF8C32" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="#16181F"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <!-- Símbolo: pierna izquierda, diagonal (por detrás) y pierna derecha -->
  <g transform="translate(332 190)">
    <path d="M0 96 L96 32 L96 360 L0 360 Z" fill="url(#pierna-izq)"/>
    <path d="M96 32 L360 232 L360 328 L96 128 Z" fill="url(#diagonal)"/>
    <path d="M264 0 L360 0 L360 328 L264 264 Z" fill="url(#pierna-der)"/>
  </g>
  <!-- Nombre -->
  <text x="512" y="740" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="-2">
    <tspan fill="#F3F4F6">Nexo</tspan><tspan fill="#FF8C32">Pos</tspan>
  </text>
  <!-- Lema -->
  <text x="512" y="830" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="40" letter-spacing="9" fill="#E6A15C">RESTAURANTES · CAFETERÍAS</text>
</svg>
